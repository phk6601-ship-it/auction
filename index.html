<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>블라인드 경매 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#241a3d;--paper:#fffaf0;--gold:#ffd23f;--night:#1b1038;--velvet:#5b1f6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Gowun Dodum','Malgun Gothic',sans-serif;color:var(--ink);user-select:none;
  background:radial-gradient(ellipse at 50% -10%,#6b2f8f 0%,#2b1452 45%,#140a2b 100%) fixed}
h1,h2,h3,.jua,button{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400}
button{font-size:18px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);padding:10px 16px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--gold)}button.go{background:#5fd38d}button.red{background:#ff8a8a}button.blue{background:#8fc3ff}
button.sm{font-size:14px;padding:6px 10px;border-width:2px;box-shadow:0 3px 0 var(--ink);border-radius:10px}
input,select{font:inherit;font-size:20px;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);min-width:0}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 #0008;padding:20px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.note{font-size:13px;background:#fff3c4;border:2px dashed var(--ink);border-radius:10px;padding:8px;text-align:left}
@keyframes wob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-60px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes glow{50%{box-shadow:0 0 0 8px #ffd23f88,0 0 50px 10px #ffd23f99}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.noanim .enter{animation:none}

/* ---------- 첫 화면 / 대기실 ---------- */
.home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.home .card{width:min(560px,100%);text-align:center}
.logo{font-family:'Jua';font-size:clamp(34px,7vw,56px);line-height:1.1;margin:4px 0 2px;color:var(--velvet)}
.logo span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
.logo span:nth-child(2n){animation-delay:.3s}
.sub{margin:0 0 18px;font-size:17px}
.waitbig{font-size:80px;animation:wob 1.6s infinite}
.teampick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.teampick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;background:color-mix(in srgb,var(--c) 30%,#fff)}
.teampick button.on{background:var(--c);outline:4px solid var(--ink);outline-offset:2px}
.teampick .em{font-size:38px;line-height:1}
.lobby{height:100dvh;display:grid;grid-template-columns:330px 1fr;gap:14px;padding:14px}
.lobby .side{display:flex;flex-direction:column;gap:10px;text-align:center;overflow:auto}
.code{font-family:'Jua';font-size:74px;letter-spacing:8px;line-height:1;margin:2px 0}
.qr{width:160px;margin:0 auto;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px}.qr svg{display:block;width:100%;height:auto}
.url{font-size:13px;word-break:break-all;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:6px}
.cfg{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;text-align:left;font-size:16px}.cfg select{font-size:16px;padding:6px 8px}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start;overflow:auto}
.tcol{background:color-mix(in srgb,var(--c) 22%,#fffaf0);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 #0008;padding:10px;min-height:220px}
.tcol h3{margin:0 0 8px;font-size:24px;text-align:center;background:var(--c);border:3px solid var(--ink);border-radius:12px;padding:4px}
.tcol .mem{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:5px 8px;margin:5px 0;font-size:17px;display:flex;justify-content:space-between;cursor:pointer}
.tcol .mem i{font-style:normal;opacity:.4}
.onoff{display:flex;align-items:center;justify-content:space-between;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-family:'Jua';font-size:19px;background:#d9ffe6}
.onoff.off{background:#ffd6d6}
.sw{width:74px;height:38px;border-radius:30px;border:3px solid var(--ink);background:#5fd38d;position:relative;cursor:pointer;flex:none;box-shadow:0 3px 0 var(--ink)}
.sw::after{content:'ON';position:absolute;top:3px;left:36px;width:28px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-size:0}
.sw.off{background:#ff8a8a}.sw.off::after{left:4px}

/* ---------- 보석 · 물건 ---------- */
.gem{display:inline-block;position:relative;line-height:0}
.gem svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 0 #0005)}
.gem b{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-family:'Jua';font-weight:400;color:#fff;-webkit-text-stroke:.09em var(--ink);paint-order:stroke;line-height:1}
.gem .x2{position:absolute;right:-12%;top:-14%;background:#ff4dd2;color:#fff;border:2px solid var(--ink);border-radius:8px;font-family:'Jua';line-height:1.2;padding:0 .25em;font-size:.32em}
.icon{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.x2badge{font-family:'Jua';background:#ff4dd2;color:#fff;border:.08em solid var(--ink);border-radius:.25em;padding:.05em .2em;line-height:1.1}

/* ---------- 선생님 큰 화면 ---------- */
.hg{height:100dvh;display:grid;grid-template-columns:1fr 250px;grid-template-rows:auto 1fr auto;gap:10px;padding:10px;overflow:hidden}
.hbar{grid-column:1;display:flex;align-items:center;gap:12px;color:#fff}
.hbar .ttl{font-family:'Jua';font-size:clamp(22px,2.4vw,34px);color:var(--gold);text-shadow:0 3px 0 #0008;white-space:nowrap}
.pill{font-family:'Jua';background:#ffffff22;border:2px solid #ffffff55;border-radius:30px;padding:4px 14px;font-size:clamp(15px,1.4vw,20px);white-space:nowrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff70}.dots i.done{background:#ffffff90}.dots i.now{background:var(--gold);border-color:#fff;animation:pulse 1s infinite}
.hmsg{flex:1;text-align:right;font-size:clamp(14px,1.3vw,19px);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{grid-column:1;position:relative;border-radius:26px;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 45% 70% at 50% 8%,#fff6c933 0%,#fff6c911 40%,transparent 70%),linear-gradient(#2a1450,#1a0d36);border:3px solid #ffffff22;box-shadow:inset 0 -40px 80px #0006}
.stage::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:16%;background:radial-gradient(ellipse at 50% 100%,#ffd23f40,transparent 70%);pointer-events:none}
.teams{grid-column:1;display:grid;gap:8px}
.tc{background:color-mix(in srgb,var(--c) 26%,#fffaf0);border:3px solid var(--ink);border-radius:16px;padding:6px 8px;box-shadow:0 5px 0 #0008;min-width:0;position:relative;transition:transform .2s}
.tc .th{display:flex;align-items:center;gap:6px;font-family:'Jua';font-size:clamp(16px,1.5vw,22px)}
.tc .th .e{font-size:1.4em;line-height:1}
.tc .th .sc{margin-left:auto;background:var(--ink);color:var(--gold);border-radius:10px;padding:0 8px;font-size:.9em;white-space:nowrap}
.tc .co{font-family:'Jua';font-size:clamp(18px,1.8vw,27px);line-height:1.15}
.tc .inv{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:30px;font-size:clamp(14px,1.2vw,18px)}
.tc .inv .gem{width:clamp(22px,1.9vw,30px);font-size:clamp(22px,1.9vw,30px)}
.tc .inv .gem b{font-size:.42em}
.tc .st{font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .st b{font-family:'Jua';font-weight:400}
.tc.in{outline:4px solid #5fd38d}.tc.in::before{content:'✓';position:absolute;right:-10px;top:-12px;width:30px;height:30px;border-radius:50%;background:#5fd38d;border:3px solid var(--ink);font-family:'Jua';font-size:20px;display:flex;align-items:center;justify-content:center}
.tc.win{animation:glow 1s infinite;transform:translateY(-6px)}
.tc.lead::after{content:'👑';position:absolute;left:-12px;top:-16px;font-size:26px;transform:rotate(-20deg)}
.ctrl{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:8px;overflow:auto}
.ctrl .card{padding:10px;border-radius:16px}
.ctrl .btns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ctrl .btns button{font-size:15px;padding:8px 4px}
.ctrl .roomc{font-family:'Jua';font-size:34px;letter-spacing:4px;text-align:center;line-height:1}
.ctrl .log{font-size:13px;line-height:1.45;max-height:170px;overflow:auto}
.ctrl .log div{border-bottom:1px dashed #0002;padding:2px 0}

/* 무대 안 내용 */
.big{color:#fff;text-align:center;width:100%;padding:18px}
.big h1{font-size:clamp(40px,5.5vw,84px);margin:0;color:var(--gold);text-shadow:0 5px 0 #0009;line-height:1.1}
.big h2{font-size:clamp(24px,2.6vw,40px);margin:8px 0;text-shadow:0 3px 0 #0008}
.big p{font-size:clamp(17px,1.6vw,24px);margin:6px 0}
.itembox{display:flex;align-items:center;gap:clamp(16px,3vw,48px);justify-content:center}
.itemart{width:clamp(150px,19vw,280px);height:clamp(150px,19vw,280px);display:flex;align-items:center;justify-content:center;position:relative;animation:float 3s ease-in-out infinite}
.itemart::before{content:'';position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#ffffff38,transparent 65%)}
.itemart .gem{width:62%;font-size:min(170px,12vw)}
.itemart .gem b{font-size:.38em}
.itemart.duo .gem{width:46%;margin:0 -2%}
.itemart .emo{font-size:clamp(100px,12vw,190px);line-height:1;position:relative}
.itemtxt{text-align:left;max-width:520px}
.itemtxt .kind{display:inline-block;background:var(--gold);color:var(--ink);font-family:'Jua';border-radius:10px;padding:2px 12px;font-size:clamp(15px,1.4vw,20px)}
.itemtxt h2{font-size:clamp(34px,4vw,62px);margin:6px 0;color:#fff;line-height:1.1}
.itemtxt p{font-size:clamp(16px,1.5vw,23px);margin:4px 0;color:#fff}
.timer{position:absolute;right:20px;top:16px;width:clamp(80px,8vw,120px);height:clamp(80px,8vw,120px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:clamp(34px,3.6vw,54px);color:var(--ink);background:conic-gradient(var(--gold) var(--p,100%),#ffffff33 0);border:4px solid var(--ink);box-shadow:0 5px 0 #0008}
.timer span{background:var(--paper);width:76%;height:76%;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
.timer.hurry span{background:#ff8a8a;animation:pulse .5s infinite}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-family:'Jua';font-size:clamp(18px,1.8vw,28px);text-shadow:0 3px 0 #0009;z-index:2}
.paused{position:absolute;inset:0;background:#140a2bee;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:5;font-family:'Jua';font-size:clamp(40px,5vw,72px)}
.paused small{font-size:.4em;font-family:'Gowun Dodum'}

.reveal{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,26px);width:100%;padding:16px}
.reveal .mini{display:flex;align-items:center;gap:12px;color:#fff;font-family:'Jua';font-size:clamp(20px,2vw,30px)}
.reveal .mini .gem{width:56px;font-size:56px}.reveal .mini .gem b{font-size:.4em}.reveal .mini .emo{font-size:48px;line-height:1}
.flips{display:flex;gap:clamp(8px,1.4vw,22px);justify-content:center;flex-wrap:wrap}
.flip{width:clamp(110px,12vw,180px);height:clamp(150px,17vw,240px);perspective:900px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border:4px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #0009}
.flip .b{background:repeating-linear-gradient(45deg,var(--c),var(--c) 12px,color-mix(in srgb,var(--c) 70%,#fff) 12px 24px);font-size:clamp(50px,5vw,80px)}
.flip .b small{font-family:'Jua';font-size:20px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 8px;margin-top:6px}
.flip .f{transform:rotateY(180deg);background:var(--paper)}
.flip .f .e{font-size:clamp(30px,3vw,46px);line-height:1}
.flip .f .n{font-family:'Jua';font-size:clamp(15px,1.3vw,20px)}
.flip .f .a{font-family:'Jua';font-size:clamp(32px,3.6vw,56px);line-height:1.1}
.flip .f .a.pass{font-size:clamp(22px,2.2vw,34px);opacity:.5}
.flip.win .f{background:var(--gold);animation:glow 1s infinite}
.flip.boom .f{background:#ffb3b3}.flip.boom{animation:shake .5s 2}
.flip.boom .f::after{content:'💥 동점';position:absolute;top:-16px;background:#ff4d4d;color:#fff;font-family:'Jua';border:3px solid var(--ink);border-radius:10px;padding:0 8px;font-size:18px}
.flip.lose .f{filter:grayscale(.6) brightness(.85)}

.winner{display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;text-align:center;padding:16px}
.winner .who{font-family:'Jua';font-size:clamp(36px,4.6vw,72px);background:var(--c);color:#fff;border:4px solid var(--ink);border-radius:22px;padding:4px 28px;text-shadow:0 3px 0 #0008;box-shadow:0 8px 0 #0009}
.winner .what{font-size:clamp(20px,2.2vw,34px);font-family:'Jua';max-width:900px}
.box3d{font-size:clamp(110px,12vw,180px);line-height:1;animation:shake .45s 4}
.mys{font-family:'Jua';font-size:clamp(40px,5vw,80px);padding:6px 30px;border-radius:20px;border:4px solid var(--ink);animation:pop .6s 1.9s cubic-bezier(.2,1.5,.4,1) both;color:var(--ink)}

.live{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:30px;color:#fff;padding:20px}
.live .emo{font-size:clamp(120px,14vw,220px);line-height:1;animation:float 2.5s infinite}
.live .top{font-family:'Jua';font-size:clamp(60px,8vw,130px);line-height:1;color:var(--gold);text-shadow:0 6px 0 #0009}
.live .by{font-family:'Jua';font-size:clamp(26px,3vw,46px);display:inline-block;background:var(--c,#ffffff22);border:3px solid var(--ink);border-radius:16px;padding:2px 18px;margin:8px 0}
.live .hist{font-size:clamp(15px,1.4vw,21px);opacity:.85}
.live .bump{animation:pop .4s}

.stand{width:min(900px,92%);display:grid;gap:8px}
.srow{color:var(--ink);display:grid;grid-template-columns:50px 50px 1fr auto auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--c) 30%,#fffaf0);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-family:'Jua';font-size:clamp(18px,1.9vw,28px);box-shadow:0 4px 0 #0008}
.srow .gems{display:flex;gap:2px}.srow .gems .gem{width:26px;font-size:26px}.srow .gems .gem b{font-size:.42em}
.srow small{font-family:'Gowun Dodum';font-size:.55em;display:block;opacity:.8}
.rules{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:16px 26px;width:min(1100px,96%);text-align:left;box-shadow:0 8px 0 #0009}
.rules h2{margin:0 0 8px;text-align:center;font-size:clamp(26px,2.8vw,42px);color:var(--velvet)}
.rules .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.rules .g div{font-size:clamp(15px,1.45vw,22px);line-height:1.4}
.rules b{font-family:'Jua';font-weight:400;color:var(--velvet)}
.evov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#140a2bcc;pointer-events:none}
.evcard{background:var(--paper);border:5px solid var(--ink);border-radius:26px;padding:22px 40px;text-align:center;box-shadow:0 10px 0 #000a;animation:drop .6s cubic-bezier(.2,1.4,.4,1);max-width:min(700px,92vw)}
.evcard .e{font-size:clamp(70px,8vw,120px);line-height:1}
.evcard h2{font-size:clamp(30px,3.6vw,56px);margin:4px 0;color:var(--velvet)}
.evcard p{font-size:clamp(18px,1.9vw,28px);margin:4px 0}
.confetti{position:fixed;top:-30px;font-size:28px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- 학생 태블릿 ---------- */
.sg{max-width:1200px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:100dvh}
.scols{display:grid;gap:10px;grid-template-areas:'item' 'act' 'inv' 'oth';grid-template-columns:minmax(0,1fr)}
.a-item{grid-area:item}.a-act{grid-area:act}.a-inv{grid-area:inv}.a-oth{grid-area:oth}
@media (min-width:980px){.scols{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:'item act' 'inv act' 'oth act' '. act';align-items:start}.pad button{font-size:26px;padding:7px 0}.disp{font-size:38px;min-height:54px}.subm{font-size:22px;padding:9px}}
.shead{display:flex;align-items:center;gap:10px;background:var(--c);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 5px 0 #0009;color:#fff;text-shadow:0 2px 0 #0007}
.shead .e{font-size:42px;line-height:1;text-shadow:none}
.shead .nm{font-family:'Jua';font-size:22px;line-height:1.1}.shead .nm small{display:block;font-family:'Gowun Dodum';font-size:14px}
.shead .money{margin-left:auto;text-align:right;font-family:'Jua';font-size:30px;line-height:1}.shead .money small{display:block;font-size:15px}
.sbox{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 5px 0 #0009}
.sitem{display:flex;align-items:center;gap:12px}
.sitem .art{width:92px;height:92px;flex:none;display:flex;align-items:center;justify-content:center}
.sitem .art .gem{width:80px;font-size:80px}.sitem .art .gem b{font-size:.38em}.sitem .art.duo .gem{width:50px;font-size:50px}
.sitem .art .emo{font-size:70px;line-height:1}
.sitem h3{margin:0;font-size:24px}.sitem p{margin:2px 0;font-size:15px}
.stime{margin-left:auto;font-family:'Jua';font-size:34px;min-width:64px;text-align:center;background:var(--gold);border:3px solid var(--ink);border-radius:14px;padding:2px 6px}
.stime.hurry{background:#ff8a8a;animation:pulse .5s infinite}
.capt{font-family:'Jua';font-size:20px;text-align:center;margin:0 0 8px}
.capt.me{background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:4px}
.disp{font-family:'Jua';font-size:46px;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 10px;margin-bottom:8px;min-height:64px}
.disp small{font-size:20px;opacity:.6}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font-size:30px;padding:10px 0}
.subm{width:100%;font-size:26px;margin-top:10px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;justify-content:center}
.chip{font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:3px 10px;box-shadow:0 2px 0 var(--ink);font-family:'Gowun Dodum'}
.chip b{font-family:'Jua';font-weight:400}
.sent{text-align:center;font-family:'Jua';font-size:20px;background:#d9ffe6;border:3px solid var(--ink);border-radius:14px;padding:8px;margin-top:8px}
.raise{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.raise button{font-size:30px;padding:18px 0}
.targets{display:grid;gap:8px}
.targets .tg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:color-mix(in srgb,var(--c) 25%,#fff);border:2px solid var(--ink);border-radius:12px;padding:6px}
.targets .tg .gb{padding:4px 6px;line-height:0;background:#fff}
.targets .tg .gb .gem{width:42px;font-size:42px}.targets .tg .gb .gem b{font-size:.42em}
.inv2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:18px}
.inv2 .gem{width:40px;font-size:40px}.inv2 .gem b{font-size:.42em}
.others{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:6px}.others span{white-space:nowrap}
.others div{background:color-mix(in srgb,var(--c) 25%,#fff);border:2px solid var(--ink);border-radius:12px;padding:4px 8px;font-family:'Jua';font-size:17px;display:flex;justify-content:space-between;gap:6px}
.lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.lock .card{width:min(520px,100%)}
.lock .big2{font-size:90px;line-height:1}
.sres{text-align:center;font-family:'Jua';font-size:22px}
.sres .r{display:inline-block;background:var(--c);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 14px;text-shadow:0 2px 0 #0007;font-size:26px}

#ov{position:fixed;inset:0;background:#140a2bb3;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#ov.on{display:flex}
#ov .card{width:min(460px,100%);max-height:92dvh;overflow:auto;text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-family:'Jua';font-size:17px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;border:2px solid #fff}
#toast.on{opacity:1}
@media (max-width:900px){.lobby{grid-template-columns:1fr;height:auto}.hg{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}.ctrl{grid-column:1;grid-row:auto}.stage{min-height:60vh}}

const shuf = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const wpick = arr => { let r = Math.random() * arr.reduce((s, x) => s + x.w, 0); for (const x of arr) { if ((r -= x.w) < 0) return x; } return arr[0]; };
function buildDeck() {
  const gems = shuf(CK.flatMap(c => GEM_PTS.map(p => ({ c, p }))));
  const g = () => ({ k: 'gem', g: [gems.pop()] }), bundle = () => ({ k: 'gem', g: [gems.pop(), gems.pop()], bundle: 1 }), s = k => ({ k });
  const r1 = [g(), ...shuf([g(), g(), g(), g(), g(), s('mystery')])];                                         // 보석 6 + 상자
  const r2 = [g(), ...shuf([g(), g(), bundle(), s('thief'), s('shield'), s('scope'), s('dbl')])];             // 보석 5 + 특수 4
  const r3 = [g(), ...shuf([bundle(), bundle(), s('thief'), s('mystery')]), s('crown')];                    // 보석 5 + 도둑 + 상자 + 왕관
  return [r1, r2, r3];
}

function gemSvg(c) {
  const k = COL[c], s = 'stroke="#241a3d" stroke-width="4" stroke-linejoin="round"';
  return `<svg viewBox="0 0 100 92"><polygon points="22,6 78,6 97,32 50,88 3,32" fill="${k.c}" ${s}/>
    <polygon points="22,6 36,32 3,32" fill="${k.l}"/><polygon points="78,6 64,32 97,32" fill="${k.d}" opacity=".85"/>
    <polygon points="36,32 64,32 50,88" fill="${k.l}" opacity=".55"/><polygon points="64,32 97,32 50,88" fill="${k.d}" opacity=".55"/>
    <polygon points="22,6 78,6 97,32 50,88 3,32" fill="none" ${s}/><polyline points="3,32 97,32" fill="none" stroke="#241a3d" stroke-width="2.5"/>
    <polyline points="22,6 36,32 50,6 64,32 78,6" fill="none" stroke="#241a3d" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="36,32 50,88 64,32" fill="none" stroke="#241a3d" stroke-width="2.5"/><ellipse cx="30" cy="16" rx="7" ry="3.5" fill="#fff" opacity=".8" transform="rotate(-20 30 16)"/></svg>`;
}
const gemH = (g, showX = true) => `<span class="gem">${gemSvg(g.c)}<b>${g.p}</b>${g.x2 && showX ? '<span class="x2">×2</span>' : ''}</span>`;
const gemTxt = g => `${COL[g.c].n} ${g.p}점${g.x2 ? '(×2)' : ''}`;
const itemName = it => it.k === 'gem' ? (it.bundle ? '묶음: ' + it.g.map(gemTxt).join(' + ') : gemTxt(it.g[0])) : SP[it.k].n;
const itemArt = it => it.k === 'gem' ? it.g.map(g => gemH(g)).join('') : `<span class="emo">${it.k === 'dbl' ? '<span class="x2badge">×2</span>' : SP[it.k].e}</span>`;
const itemKind = it => it.k === 'gem' ? (it.bundle ? '💎 묶음 경매' : '💎 보석') : it.k === 'crown' ? '🔥 실시간 경매' : it.k === 'mystery' ? '❓ 미스터리' : '✨ 특수 카드';
const itemDesc = it => {
  if (it.k !== 'gem') return SP[it.k].d;
  return it.bundle ? '보석 2개를 한 번에! 세트 모으기에 딱이에요' : `${COL[it.g[0].c].n}을 3개 모으면 +${SET3}, 4색을 다 모으면 +${RAINBOW}`;
};
const won = n => Number(n || 0).toLocaleString('ko-KR');
function score(t) {
  const cnt = { r: 0, b: 0, g: 0, y: 0 }; let gem = 0;
  for (const g of t.gems) { gem += g.p * (g.x2 ? 2 : 1); cnt[g.c]++; }
  const set = CK.filter(c => cnt[c] >= 3).length * SET3, rb = Math.min(...CK.map(c => cnt[c])) * RAINBOW;
  const crown = t.crown ? CROWN_PTS : 0, coin = Math.floor(t.coins / COIN_PER_PT);
  return { gem, set, rb, bonus: t.bonus, crown, coin, total: gem + set + rb + t.bonus + crown + coin, cnt };
}
// 모둠 입찰가: 모두 같은 숫자면 그 숫자, 다르면 중간값 (아무도 안 내면 null)
function teamBid(i) {
  const t = G.teams[i], v = t.mem.map(p => G.sug[i]?.[p]).filter(x => x != null).sort((a, b) => a - b);
  if (!v.length) return null; const m = v.length >> 1;
  return v.length % 2 ? v[m] : Math.floor((v[m - 1] + v[m]) / 2);
}
const spHtml = t => [t.shield ? `🛡️${t.shield > 1 ? '×' + t.shield : ''}` : '', t.scope ? `🔭${t.scope > 1 ? '×' + t.scope : ''}` : '', t.dbl ? `<span class="x2badge">×2</span>${t.dbl > 1 ? '×' + t.dbl : ''}` : '', t.crown ? '👑' : '', t.bonus ? `🎁${t.bonus > 0 ? '+' : ''}${t.bonus}` : ''].filter(Boolean).join(' ');

const Snd = {
  ctx: null, on: true,
  beep(f, d = .1, type = 'triangle', v = .18, t0 = 0) {
    if (!this.on) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); const x = this.ctx, t = x.currentTime + t0;
      const o = x.createOscillator(), g = x.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + .02);
    } catch { }
  },
  show() { [523, 784, 1047].forEach((f, i) => this.beep(f, .2, 'sine', .18, i * .1)); },
  flip() { this.beep(330 + Math.random() * 80, .08, 'square', .08); this.beep(660, .12, 'triangle', .12, .05); },
  gavel() { [0, .28, .56].forEach(t => { this.beep(140, .18, 'square', .25, t); this.beep(90, .2, 'sine', .3, t); }); },
  boom() { this.beep(120, .5, 'sawtooth', .2); this.beep(80, .6, 'square', .15, .05); },
  coin() { this.beep(988, .09); this.beep(1319, .25, 'triangle', .18, .09); },
  tick() { this.beep(1200, .04, 'square', .06); },
  bad() { this.beep(300, .15, 'sawtooth', .1); this.beep(200, .3, 'sawtooth', .1, .15); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.beep(f, .22, 'triangle', .2, i * .14)); },
  roll() { for (let i = 0; i < 14; i++) this.beep(180 + (i % 2) * 40, .05, 'square', .05, i * .07); },
};

/* ---------------- 연결 (Firebase 또는 이 컴퓨터 안에서만) ---------------- */
const Net = {
  mode: 'local', error: '',
  async init() {
    if (firebaseConfig && firebaseConfig.databaseURL) {
      try { await this.firebase(); this.mode = 'firebase'; return; }
      catch (e) { console.error(e); this.error = 'Firebase에 연결하지 못했어요. 인터넷과 Firebase 규칙(Rules)을 확인하세요.'; }
    }
    this.local();
  },
  local() {
    const bc = new BroadcastChannel('auction'), subs = new Set(), k = c => 'au:pub:' + c;
    bc.onmessage = e => subs.forEach(f => f(e.data));
    const sub = f => { subs.add(f); return () => subs.delete(f); };
    this.publish = (c, v) => { const s = JSON.stringify(v); LS.set(k(c), s); bc.postMessage({ t: 'pub', c, s }); };
    this.load = async c => JSON.parse(LS.get(k(c)) || 'null');
    this.hostListen = (c, cb) => sub(m => m.t === 'act' && m.c === c && cb(JSON.parse(m.s)));
    this.watchPub = (c, cb) => { const r = LS.get(k(c)); setTimeout(() => cb(r ? JSON.parse(r) : null)); return sub(m => m.t === 'pub' && m.c === c && cb(JSON.parse(m.s))); };
    this.send = (c, a) => bc.postMessage({ t: 'act', c, s: JSON.stringify(a) });
    this.beat = c => { const v = Date.now(); LS.set('au:beat:' + c, v); bc.postMessage({ t: 'beat', c, v }); };
    this.watchBeat = (c, cb) => { const r = LS.get('au:beat:' + c); setTimeout(() => cb(r ? +r : 0)); return sub(m => m.t === 'beat' && m.c === c && cb(m.v)); };
  },
  async firebase() {
    const V = '10.12.2';
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
    const fapp = A.initializeApp(firebaseConfig, 'auction'), db = D.getDatabase(fapp);
    try {
      const Au = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
      await Au.signInAnonymously(Au.getAuth(fapp));
    } catch (e) { console.warn('익명 로그인 실패', e); }
    const r = p => D.ref(db, `${DB_ROOT}/${p}`);
    const oops = e => { console.error(e); toast('저장에 실패했어요. Firebase 규칙(Rules)을 확인하세요'); };
    this.publish = (c, v) => D.set(r(`${c}/pub`), JSON.stringify(v)).catch(oops);
    this.load = async c => { const s = await D.get(r(`${c}/pub`)); return s.exists() ? JSON.parse(s.val()) : null; };
    this.hostListen = (c, cb) => D.onChildAdded(r(`${c}/inbox`), snap => { let a = null; try { a = JSON.parse(snap.val()); } catch { } D.remove(snap.ref); if (a) cb(a); });
    this.watchPub = (c, cb) => D.onValue(r(`${c}/pub`), s => cb(s.exists() ? JSON.parse(s.val()) : null));
    this.send = (c, a) => D.push(r(`${c}/inbox`), JSON.stringify(a)).catch(oops);
    this.beat = c => D.set(r(`${c}/beat`), Date.now()).catch(() => { });
    this.watchBeat = (c, cb) => D.onValue(r(`${c}/beat`), s => cb(s.exists() ? +s.val() : 0));
    await Promise.race([D.get(r('_ping')), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 8000))]);
  },
};

let role = null, code = '', G = null, off = 0;
let me = LS.get('au:pid'); if (!me) { me = 'p' + Math.random().toString(36).slice(2, 10); LS.set('au:pid', me); }
const now = () => Date.now() - off;          // 선생님 화면 시계 기준
const tn = i => { const t = G.teams[i]; return t ? `${TEAMS[t.id].e} ${TEAMS[t.id].n} 모둠` : ''; };
const TD = i => TEAMS[G.teams[i].id];
const active = () => G.teams.map((t, i) => i).filter(i => G.teams[i].mem.length);

/* ==========================================================
   선생님 화면 = 심판 (모든 규칙은 여기서 판정)
   ========================================================== */
const H = {
  fresh() { return { v: 0, code, phase: 'lobby', open: true, paused: false, pleft: 0, cfg: { teams: 6, bid: 40 }, players: {}, teams: [], deck: null, round: 0, idx: -1, item: null, step: '', deadline: 0, bids: {}, sug: {}, peek: {}, reveal: null, result: null, live: null, steal: null, ev: null, log: [], msg: '', rank: null, n: 0 }; },
  pub() { G.v++; G.now = Date.now(); Net.publish(code, G); render(); },
  say(m) { G.msg = m; G.log.unshift(m); G.log.length = Math.min(G.log.length, 30); },
  teamOf(pid) { return G.teams.findIndex(t => t.mem.includes(pid)); },
  amt(v, t) { const n = Math.floor(Number(v)); return Number.isFinite(n) && n >= 0 && n <= t.coins ? n : null; },

  act(a) {
    if (!G) return;
    if (a.t === 'join') return this.join(a);
    if (!a.host && (!G.open || G.paused)) return;          // 선생님이 끄거나 멈추면 학생 행동은 모두 무시
    if (G.phase !== 'play') return;
    const ti = a.host ? (a.ti ?? -1) : this.teamOf(a.pid); if (ti < 0 && !a.host) return;
    const t = G.teams[ti], cap = a.host || (t && t.cap === a.pid);
    if (a.t === 'bid' && G.step === 'bid' && t && !a.host) { const v = this.amt(a.amt, t); if (v == null) return; (G.sug[ti] = G.sug[ti] || {})[a.pid] = v; this.checkAll(); this.pub(); }   // 모둠원 모두 금액을 내요
    else if (a.t === 'peek' && G.step === 'bid' && t && t.scope > 0) {
      const tg = a.target | 0; if (tg === ti || !G.teams[tg]) return;
      const tb = teamBid(tg);
      if (tb == null) G.peek[ti] = { tg, none: 1 };
      else { t.scope--; G.peek[ti] = { tg, amt: tb }; this.say(`${tn(ti)}이 🔭 망원경으로 몰래 엿봤어요!`); }
      this.pub();
    }
    else if (a.t === 'raise' && G.step === 'live' && t && cap) this.raise(ti, a.inc | 0);
    else if (a.t === 'steal' && G.step === 'steal' && G.steal && (a.host || (G.steal.ti === ti && cap))) {
      const v = G.teams[a.vt]; if (!v || a.vt === G.steal.ti || !v.gems[a.gi]) return; this.doSteal({ ti: a.vt, gi: a.gi });
    }
  },
  join(a) {
    const name = String(a.name || '').trim().slice(0, 8); if (!name || !a.pid) return;
    if (!G.open && !G.players[a.pid]) return;
    const old = G.players[a.pid];
    if (G.phase === 'lobby') G.players[a.pid] = { name, team: old ? old.team : -1, at: old?.at || Date.now() };
    else {
      let i = this.teamOf(a.pid);
      if (i < 0) { i = G.teams.map((t, k) => k).sort((x, y) => G.teams[x].mem.length - G.teams[y].mem.length)[0]; G.teams[i].mem.push(a.pid); if (!G.teams[i].cap) G.teams[i].cap = a.pid; }
      G.players[a.pid] = { name, team: G.teams[i].id, at: old?.at || Date.now() };
    }
    this.pub();
  },
  smallest() { const n = [...Array(G.cfg.teams).keys()].map(id => Object.values(G.players).filter(p => p.team === id).length); return n.indexOf(Math.min(...n)); },
  shuffle() {
    const ids = shuf(Object.keys(G.players)), s = Math.floor(Math.random() * G.cfg.teams);
    ids.forEach((p, i) => G.players[p].team = (i + s) % G.cfg.teams); this.pub();
  },
  unassign() { for (const p of Object.values(G.players)) p.team = -1; this.pub(); },
  start() {
    for (const p of Object.values(G.players)) if (p.team < 0 || p.team >= G.cfg.teams) p.team = this.smallest();
    const ps = Object.entries(G.players).sort((a, b) => a[1].at - b[1].at);
    let ids = [...Array(G.cfg.teams).keys()];
    if (ps.length) ids = ids.filter(id => ps.some(p => p[1].team === id));
    if (ids.length < 2) return toast('두 모둠 이상 들어와야 시작할 수 있어요');
    G.teams = ids.map(id => { const mem = shuf(ps.filter(p => p[1].team === id).map(p => p[0])); return { id, coins: START_COIN, gems: [], bonus: 0, crown: 0, shield: 0, scope: 0, dbl: 0, mem, ci: 0, cap: mem[0] || null }; });
    Object.assign(G, { phase: 'play', deck: buildDeck(), round: 0, idx: -1, item: null, step: 'intro', deadline: 0, log: [], reveal: null, result: null, live: null, steal: null, ev: null, rank: null, paused: false });
    this.say('경매장에 오신 걸 환영해요!'); this.pub();
  },

  /* ---- 진행 ---- */
  beginRound() {
    if (G.phase !== 'play' || !['intro', 'roundEnd'].includes(G.step)) return;
    G.round++; G.idx = -1; G.item = null; G.step = 'round'; G.deadline = Date.now() + 4200;
    if (G.round > 1) { G.teams.forEach(t => t.coins += ROUND_BONUS); this.say(`${G.round}라운드 시작! 모든 모둠 +${ROUND_BONUS}코인`); }
    else this.say('1라운드 시작!');
    this.pub();
  },
  afterRound() {
    if (G.round > 1) { this.event(); G.step = 'event'; G.deadline = Date.now() + 6500; this.pub(); }
    else this.nextItem();
  },
  event(kind) {
    const e = kind ? EVENTS.find(x => x.k === kind) : wpick(EVENTS), act = active(); let who = [], d = '';
    if (e.k === 'tax') {
      const mx = Math.max(...act.map(i => G.teams[i].coins)); who = act.filter(i => G.teams[i].coins === mx);
      const paid = who.map(i => { const t = G.teams[i], x = Math.floor(t.coins / 10); t.coins -= x; return x; });
      d = `코인이 가장 많은 ${who.map(tn).join(', ')}이 10%(${won(paid[0])}코인)를 세금으로 내요`;
    } else if (e.k === 'aid') {
      const mn = Math.min(...act.map(i => score(G.teams[i]).total)); who = act.filter(i => score(G.teams[i]).total === mn);
      who.forEach(i => G.teams[i].coins += 150); d = `점수가 가장 낮은 ${who.map(tn).join(', ')}에게 응원금 150코인!`;
    } else { act.forEach(i => G.teams[i].coins += 100); who = act; d = '하늘에서 황금 비가 내려요! 모든 모둠 +100코인'; }
    G.ev = { k: e.k, e: e.e, n: e.n, d, who, id: (G.ev?.id || 0) + 1, until: Date.now() + 6000 };
    this.say(`${e.e} ${e.n}: ${d}`);
  },
  manualEvent(kind) { if (G.phase !== 'play' || ['intro', 'round', 'event'].includes(G.step)) return toast('경매 중에 쓸 수 있어요'); this.event(kind); this.pub(); },
  nextItem() {
    G.reveal = null; G.result = null; G.live = null; G.steal = null; G.bids = {}; G.sug = {}; G.peek = {}; G.allIn = false;
    const list = G.deck[G.round - 1]; G.idx++;
    if (G.idx >= list.length) {
      if (G.round >= 3) return this.finish();
      G.step = 'roundEnd'; G.item = null; G.deadline = 0; this.say(`${G.round}라운드 끝! 선생님이 다음 라운드를 열어요`); return this.pub();
    }
    G.item = list[G.idx]; G.n++;
    G.teams.forEach(t => { t.cap = t.mem.length ? t.mem[t.ci++ % t.mem.length] : null; });
    G.step = 'show'; G.deadline = Date.now() + SHOW_SEC * 1000; this.say(`${itemName(G.item)} 등장!`); this.pub();
  },
  openBid() {
    if (G.item.k === 'crown') { G.step = 'live'; G.live = { top: 0, ti: -1, hist: [], n: 0 }; G.deadline = Date.now() + LIVE_FIRST * 1000; this.say('👑 실시간 경매 시작! 대장이 값을 올려요'); }
    else { G.step = 'bid'; G.deadline = Date.now() + G.cfg.bid * 1000; this.say('비밀 입찰 시작! 모둠끼리 작전을 짜요'); }
    this.pub();
  },
  checkAll() {
    const act = active();
    if (act.length && act.every(i => G.teams[i].mem.every(p => G.sug[i]?.[p] != null))) { if (!G.allIn) G.deadline = Math.min(G.deadline || Infinity, Date.now() + 5000); G.allIn = true; }
  },
  closeBid() {
    active().forEach(i => G.bids[i] = teamBid(i));
    const rows = active().map(i => ({ ti: i, amt: G.bids[i] ?? 0, none: G.bids[i] == null }));
    rows.sort((a, b) => a.amt - b.amt || a.ti - b.ti);
    const cnt = {}; rows.forEach(r => { if (r.amt > 0) cnt[r.amt] = (cnt[r.amt] || 0) + 1; });
    let win = -1, price = 0;
    for (let k = rows.length - 1; k >= 0; k--) { const r = rows[k]; if (r.amt <= 0) break; if (cnt[r.amt] === 1) { win = r.ti; price = r.amt; break; } }
    const bombs = Object.keys(cnt).map(Number).filter(v => cnt[v] > 1 && v > price);
    G.reveal = { rows, win, price, bombs, at: Date.now() + 700 };
    G.step = 'reveal'; G.deadline = G.reveal.at + rows.length * REVEAL_STEP + 2800;
    this.say('입찰 마감! 낮은 금액부터 공개해요'); this.pub();
  },
  afterReveal() {
    const R = G.reveal;
    if (R.win < 0) {
      const txt = R.bombs.length ? '💥 동점 폭탄! 같은 금액끼리 모두 탈락해서 아무도 못 가졌어요' : '아무도 입찰하지 않아 유찰됐어요';
      G.result = { ti: -1, txt }; this.say(txt); G.step = 'result'; G.deadline = Date.now() + 4500; return this.pub();
    }
    G.teams[R.win].coins -= R.price; this.award(R.win, G.item, R.price);
  },
  award(ti, it, price) {
    const t = G.teams[ti], res = { ti, price, item: it }; let txt = '';
    if (it.k === 'gem') {
      const gs = it.g.map(g => ({ ...g }));
      if (t.dbl > 0) { gs.reduce((a, b) => b.p > a.p ? b : a).x2 = 1; t.dbl--; res.dbl = 1; }
      t.gems.push(...gs); res.gems = gs; txt = `${gs.map(gemTxt).join(' + ')}을(를) 가져갔어요!${res.dbl ? ' ✖️2 점수 2배!' : ''}`;
    } else if (it.k === 'mystery') { const o = wpick(MYSTERY); t.bonus += o.v; res.mys = o; txt = `🎁 상자를 열었더니… ${o.n} ${o.v > 0 ? '+' : ''}${o.v}점`; }
    else if (it.k === 'thief') {
      if (G.teams.some((x, j) => j !== ti && x.gems.length)) {
        G.step = 'steal'; G.steal = { ti, price }; G.deadline = Date.now() + STEAL_SEC * 1000;
        this.say(`${tn(ti)}이 ${won(price)}코인에 🦹 도둑 낙찰! 뺏을 보석을 골라요`); return this.pub();
      }
      txt = '🦹 도둑을 샀지만 뺏을 보석이 없어요';
    }
    else if (it.k === 'crown') { t.crown = 1; txt = `👑 전설의 왕관을 차지했어요! +${CROWN_PTS}점`; }
    else { t[it.k]++; txt = `${SP[it.k].n}을(를) 얻었어요!`; }
    res.txt = `${tn(ti)} ${won(price)}코인에 낙찰! ${txt}`; G.result = res;
    G.step = 'result'; G.deadline = Date.now() + (res.mys ? 7000 : 5000); this.say(res.txt); this.pub();
  },
  doSteal(ch) {
    const s = G.steal; if (!s) return;
    if (!ch) { const all = G.teams.flatMap((x, j) => j === s.ti ? [] : x.gems.map((g, gi) => ({ ti: j, gi }))); if (!all.length) return this.nextItem(); ch = all[Math.floor(Math.random() * all.length)]; }
    const v = G.teams[ch.ti], res = { ti: s.ti, price: s.price, item: G.item, vt: ch.ti };
    if (v.shield > 0) { v.shield--; res.block = 1; res.txt = `🛡️ ${tn(ch.ti)}의 방패가 도둑을 막았어요!`; }
    else { const [g] = v.gems.splice(ch.gi, 1); G.teams[s.ti].gems.push(g); res.gems = [g]; res.txt = `🦹 ${tn(s.ti)}이 ${tn(ch.ti)}의 ${gemTxt(g)}을(를) 훔쳤어요!`; }
    G.steal = null; G.result = res; G.step = 'result'; G.deadline = Date.now() + 5000; this.say(res.txt); this.pub();
  },
  raise(ti, inc) {
    const L = G.live, t = G.teams[ti]; if (![50, 100, 200].includes(inc) || L.ti === ti) return;
    const nv = L.top + inc; if (nv > t.coins) return;
    L.top = nv; L.ti = ti; L.n++; L.hist.unshift({ ti, v: nv }); L.hist.length = Math.min(L.hist.length, 5);
    G.deadline = Math.max(G.deadline, Date.now() + LIVE_SEC * 1000); this.say(`${tn(ti)} ${won(nv)}코인!`); this.pub();
  },
  liveEnd() {
    const L = G.live;
    if (L.ti < 0) { G.result = { ti: -1, txt: '아무도 값을 부르지 않아 왕관이 유찰됐어요' }; G.step = 'result'; G.deadline = Date.now() + 4500; this.say(G.result.txt); return this.pub(); }
    G.teams[L.ti].coins -= L.top; this.award(L.ti, G.item, L.top);
  },
  finish() {
    G.phase = 'end'; G.step = ''; G.deadline = 0;
    G.rank = active().map(i => ({ i, s: score(G.teams[i]) })).sort((a, b) => b.s.total - a.s.total || G.teams[b.i].coins - G.teams[a.i].coins);
    this.say('경매 끝! 최종 점수를 공개해요'); this.pub();
  },

  /* ---- 선생님 버튼 ---- */
  toggleOpen() {
    G.open = !G.open;
    if (!G.open) { G.offPaused = !G.paused; this.pause(true); this.say('🔒 선생님이 게임을 잠갔어요'); }
    else { if (G.offPaused) this.pause(false); G.offPaused = false; this.say('🔓 게임이 다시 열렸어요'); }
    this.pub();
  },
  pause(on) {
    if (on && !G.paused) { G.paused = true; G.pleft = G.deadline ? Math.max(0, G.deadline - Date.now()) : 0; G.deadline = 0; }
    else if (!on && G.paused) { G.paused = false; if (G.pleft) G.deadline = Date.now() + Math.max(G.pleft, 3000); G.pleft = 0; }
  },
  togglePause() { if (!G.open) return toast('먼저 게임을 켜 주세요'); this.pause(!G.paused); this.say(G.paused ? '⏸ 잠깐 멈췄어요' : '▶ 다시 시작!'); this.pub(); },
  closeNow() {
    if (G.paused) return toast('멈춤을 풀고 눌러 주세요');
    if (G.step === 'show') this.openBid(); else if (G.step === 'bid') this.closeBid(); else if (G.step === 'live') this.liveEnd();
    else if (G.step === 'steal') this.doSteal(null); else if (G.step === 'reveal') this.afterReveal(); else if (G.step === 'result') this.nextItem();
    else if (G.step === 'round') this.afterRound(); else if (G.step === 'event') this.nextItem();
  },
  addTime() { if (G.paused) { if (G.pleft) G.pleft += 15000; } else if (G.deadline && ['bid', 'live', 'steal', 'show'].includes(G.step)) G.deadline += 15000; else return; this.say('⏱ 15초 더!'); this.pub(); },
  skip() {
    if (G.paused) return toast('멈춤을 풀고 눌러 주세요');
    if (['show', 'bid', 'live'].includes(G.step)) { G.result = { ti: -1, txt: '선생님이 이번 경매를 건너뛰었어요' }; G.reveal = null; G.live = null; G.step = 'result'; G.deadline = Date.now() + 2500; this.say(G.result.txt); this.pub(); }
    else this.closeNow();
  },
  rotCap(i) { const t = G.teams[i]; if (!t || t.mem.length < 2) return; t.cap = t.mem[(t.mem.indexOf(t.cap) + 1) % t.mem.length]; this.say(`${tn(i)} 대장이 ${G.players[t.cap]?.name}(으)로 바뀌었어요`); this.pub(); },

  tick() {
    if (!G || G.phase !== 'play' || G.paused || !G.deadline || Date.now() < G.deadline) return;
    G.deadline = 0;
    ({ round: () => this.afterRound(), event: () => this.nextItem(), show: () => this.openBid(), bid: () => this.closeBid(), reveal: () => this.afterReveal(), steal: () => this.doSteal(null), result: () => this.nextItem(), live: () => this.liveEnd() }[G.step] || (() => { }))();
  },
  resume() {   // 선생님 화면을 새로고침했을 때 이어가기
    if (G.phase !== 'play' || G.paused) return;
    if (!G.deadline && ['round', 'event', 'show', 'bid', 'reveal', 'steal', 'result', 'live'].includes(G.step)) G.deadline = Date.now() + 3000;
    this.pub();
  },
};

  if (!$('#s-head')) app.innerHTML = `<div class="sg"><div id="s-head"></div><div id="s-pause"></div><div class="scols"><div class="a-item" id="s-item"></div><div class="a-act" id="s-act"></div><div class="sbox a-inv" id="s-inv"></div><div class="others a-oth" id="s-oth"></div></div><div id="s-foot" style="text-align:center"></div></div>`;
  put('s-head', `<div class="shead" style="--c:${td.c}"><span class="e">${td.e}</span><div class="nm">${td.n} 모둠<small>${esc(G.players[me].name)}${isCap && G.phase === 'play' && (G.step === 'live' || G.step === 'steal' || it?.k === 'crown') ? ' · 👑 대장' : ''}</small></div><div class="money">🪙 ${won(t.coins)}<small>⭐ ${s.total}점</small></div></div>`);
  put('s-pause', G.paused ? `<div class="sbox capt" style="background:#fff3c4">⏸ 선생님이 잠깐 멈췄어요</div>` : '');
  put('s-item', head);
  if (Array.isArray(body)) { put('s-act', `<div class="sbox" data-k="${key}">${body.map((_, k) => `<div id="m${k}"></div>`).join('')}</div>`); body.forEach((h, k) => put('m' + k, h)); }
  else put('s-act', body);
  put('s-inv', `<div class="jua" style="margin-bottom:6px">우리 모둠 보물함</div><div class="inv2">${t.gems.length ? t.gems.map(g => gemH(g)).join('') : '<span style="opacity:.6">아직 보석이 없어요</span>'} ${spHtml(t)}</div>
      <div style="font-size:13px;margin-top:6px">보석 ${s.gem} · 세트 ${s.set + s.rb} · 상자 ${s.bonus} · 왕관 ${s.crown} · 코인 ${s.coin} = <b>${s.total}점</b></div>`);
  put('s-oth', others);
  put('s-foot', `<button class="sm" onclick="toggleSnd()">${Snd.on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐'}</button>`);
  evOverlay(); uiTick();
}
function bidUi(ti, t) {
  const votes = G.sug[ti] || {}, mine = votes[me], peek = G.peek[ti], tb = teamBid(ti), vals = t.mem.map(p => votes[p]).filter(v => v != null), same = vals.length > 1 && vals.every(v => v === vals[0]);
  const mates = `<div class="chips">${t.mem.map(p => { const v = votes[p]; return `<span class="chip" ${v != null && p !== me ? `onclick="padSet(${v})"` : ''} style="${p === me ? 'background:#fff3c4' : ''}">${esc(G.players[p]?.name || '')} <b>${v == null ? '…' : v ? won(v) : '패스'}</b></span>`; }).join('')}</div>`;
  const team = `<div class="sent" style="margin:0 0 8px;background:${same ? '#d9ffe6' : '#fff'}">🧮 지금 우리 모둠 금액: <b>${tb == null ? '-' : tb ? won(tb) + '코인' : '패스'}</b><br><small>${!vals.length ? '아직 아무도 안 냈어요' : same ? '👍 모두 같은 숫자! 그대로 들어가요' : `${vals.length}/${t.mem.length}명 냈어요 · 숫자가 다르면 중간값으로 정해져요`}</small></div>`;
  const peekBox = peek ? `<div class="sent" style="background:#e3edff;margin:0 0 8px">🔭 ${tn(peek.tg)}: ${peek.none ? '아직 아무도 안 냈어요 (다시 써 봐요)' : `지금 <b>${won(peek.amt)}코인</b>`}</div>` : '';
  const disp = `<div class="disp">${pad.v ? won(pad.v) : '<small>금액을 눌러요</small>'} <small>코인</small></div>`, keypad = `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="padIn(${n})">${n}</button>`).join('')}<button class="red" onclick="padC()">지우기</button><button onclick="padIn(0)">0</button><button onclick="padBk()">⌫</button></div>`;
  const scope = t.scope > 0 ? `<div class="row" style="margin-top:10px"><button class="blue" onclick="scopePop()">🔭 망원경 쓰기 (${t.scope})</button></div>` : '';
  return [`<div class="capt">💰 모둠원 모두 금액을 내요! 친구 숫자를 누르면 그 금액이 입력돼요</div>${mates}${team}${peekBox}`, disp, keypad,
    `<button class="go subm" onclick="doBid()">${mine != null ? '🔁 내 금액 바꾸기' : '🤫 내 금액 내기'}</button><button class="sm" style="width:100%;margin-top:8px" onclick="send({t:'bid',amt:0})">🙅 패스 (0코인)</button>${mine != null ? `<div class="sent">내가 낸 금액: <b>${mine ? won(mine) + '코인' : '패스'}</b> <small>· 마감 전까지 바꿀 수 있어요</small></div>` : ''}${scope}`];
}
function liveUi(ti, t, isCap, capn) {
  const L = G.live, lead = L.ti === ti, td = L.ti >= 0 ? TD(L.ti) : null;
  const top = `<div class="disp" style="font-size:40px">${L.ti >= 0 ? `${td.e} ${won(L.top)}` : '아직 없음'} <small>코인</small></div>`;
  if (!isCap) return [top, `<div class="capt">${lead ? '👑 지금 우리가 1등!' : `👑 대장 ${capn}이(가) 값을 올려요!`}</div>`];
  return [top, `<div class="capt me">${lead ? '👑 지금 우리가 1등! 지켜봐요' : '🔥 값을 올려 왕관을 차지해요!'}</div>`,
    `<div class="raise">${[50, 100, 200].map(n => `<button class="pri" ${lead || L.top + n > t.coins ? 'disabled' : ''} onclick="send({t:'raise',inc:${n}})">+${n}</button>`).join('')}</div>
    <div style="text-align:center;font-size:14px;margin-top:6px">우리 코인 ${won(t.coins)} · 올리면 ${won(L.top + 50)}부터</div>`];
}
function studentEnd(ti) {
  const k = G.rank.findIndex(r => r.i === ti), r = G.rank[k], s = r.s, td = TD(ti);
  return `<div class="sbox" style="text-align:center"><div style="font-size:70px">${['🥇', '🥈', '🥉'][k] || '🎉'}</div><h2 style="margin:4px 0">${td.n} 모둠 ${k + 1}등!</h2><p style="font-size:20px">⭐ ${s.total}점</p><p>보석 ${s.gem} · 같은 색 세트 ${s.set} · 4색 세트 ${s.rb} · 상자 ${s.bonus} · 왕관 ${s.crown} · 코인 ${s.coin}</p></div>`;
}
window.padIn = n => { const t = G.teams[myTi()]; let v = (pad.v + n).replace(/^0+(?=\d)/, ''); if (+v > t.coins) { v = String(t.coins); toast(`우리 코인은 ${won(t.coins)}개예요`); } if (v.length > 5) return; pad.v = v; render(); };
window.padC = () => { pad.v = ''; render(); };
window.padBk = () => { pad.v = pad.v.slice(0, -1); render(); };
window.padSet = v => { pad.v = String(v); render(); };
window.doBid = () => { if (pad.v === '') return toast('금액을 먼저 눌러요 (패스는 아래 버튼)'); send({ t: 'bid', amt: +pad.v }); Snd.coin(); toast('내 금액을 냈어요 🤫'); };
window.scopePop = () => { const ti = myTi(); openOv(`<h2 style="margin:0 0 6px">🔭 누구를 엿볼까요?</h2><p style="margin:0 0 8px;font-size:14px">그 모둠이 <b>지금</b> 낸 금액이 보여요. 아직 안 냈으면 망원경은 그대로 남아요.</p><div class="teampick">${G.teams.map((x, j) => j === ti ? '' : `<button style="--c:${TEAMS[x.id].c}" onclick="closeOv();send({t:'peek',target:${j}})"><span class="em">${TEAMS[x.id].e}</span>${TEAMS[x.id].n}</button>`).join('')}</div><button class="sm" onclick="closeOv()">닫기</button>`); };

/* ---------------- 0.25초마다: 시계 · 카드 뒤집기 · 실시간 경매 ---------------- */
function uiTick() {
  if (!G || G.phase !== 'play') return;
  const L = left(), hurry = L <= 5 && !G.paused;
  const tm = $('#tmr'), tn2 = $('#tmrn'), stm = $('#stm');
  if (tm && tn2) {
    const total = G.step === 'bid' ? G.cfg.bid : G.step === 'live' ? (G.live?.n ? LIVE_SEC : LIVE_FIRST) : G.step === 'steal' ? STEAL_SEC : SHOW_SEC;
    tn2.textContent = L; tm.style.setProperty('--p', Math.min(100, L / total * 100) + '%'); tm.classList.toggle('hurry', hurry);
  }
  if (stm) { stm.textContent = G.paused ? '⏸' : L; stm.classList.toggle('hurry', hurry); }
  if (role === 'host' && ['bid', 'live'].includes(G.step) && hurry && L !== lastTickSec && L > 0) { lastTickSec = L; Snd.tick(); }
  if (G.step === 'bid' && $('#incnt')) { const a = active(); const all = a.flatMap(i => G.teams[i].mem); $('#incnt').textContent = `(${all.filter(p => G.sug[G.teams.findIndex(t => t.mem.includes(p))]?.[p] != null).length}/${all.length}명 입력)`; }
  if (G.step === 'reveal' && $('#fl0')) {
    const R = G.reveal, n = Math.min(R.rows.length, Math.floor((now() - R.at) / REVEAL_STEP) + 1);
    if (n !== flipped) {
      const was = flipped; flipped = n;
      for (let k = 0; k < R.rows.length; k++) $('#fl' + k)?.classList.toggle('on', k < n);
      const all = n >= R.rows.length;
      if (all) {
        R.rows.forEach((r, k) => { const el = $('#fl' + k); el.classList.toggle('win', r.ti === R.win); el.classList.toggle('boom', R.bombs.includes(r.amt)); el.classList.toggle('lose', r.ti !== R.win && !R.bombs.includes(r.amt)); });
        $('#rvh').textContent = R.win >= 0 ? `🔨 ${tn(R.win)} ${won(R.price)}코인에 낙찰!${R.bombs.length ? ' (위에서 💥 동점 폭탄!)' : ''}` : R.bombs.length ? '💥 동점 폭탄! 아무도 못 가져요' : '아무도 입찰하지 않았어요';
        if (was >= 0 && was < n) { R.bombs.length ? Snd.boom() : null; R.win >= 0 && setTimeout(() => Snd.gavel(), R.bombs.length ? 500 : 0); }
        put('teams', teamsHtml());
      } else if (was >= 0 && n > 0) Snd.flip();
    }
  }
  if (G.step === 'live' && $('#ltop')) {
    const Lv = G.live, td = Lv.ti >= 0 ? TD(Lv.ti) : null;
    if ($('#ltop').dataset.n != Lv.n) {
      $('#ltop').dataset.n = Lv.n; $('#ltop').textContent = Lv.ti >= 0 ? won(Lv.top) + '코인' : '0코인'; $('#ltop').classList.remove('bump'); void $('#ltop').offsetWidth; $('#ltop').classList.add('bump');
      $('#lby').innerHTML = td ? `<span class="by" style="--c:${td.c}">${td.e} ${td.n} 모둠</span>` : '<span class="by">첫 번째로 부를 모둠은?</span>';
      $('#lhist').innerHTML = Lv.hist.slice(1).map(h => `${TD(h.ti).e} ${won(h.v)}`).join(' ← ');
      if (Lv.n && Lv.n !== lastLiveN) { lastLiveN = Lv.n; Snd.coin(); }
    }
  }
  if (role === 'player' && teacherAway() && screen !== 'lock') render();
  if (role === 'player' && screen === 'lock' && G.open && !teacherAway()) render();
  if ($('#evl').innerHTML && !(G.ev && now() < G.ev.until)) $('#evl').innerHTML = '';
}
setInterval(uiTick, 250);
window.send = send;
window.toggleSnd = () => { Snd.on = !Snd.on; LS.set(role === 'host' ? 'au:hsnd' : 'au:snd', Snd.on ? '1' : '0'); if (Snd.on) Snd.coin(); render(); };

/* ---------------- 팝업 · 결과 ---------------- */
function openOv(html, k = '') { const o = $('#ov'); o.innerHTML = `<div class="card" onclick="event.stopPropagation()">${html}</div>`; o.dataset.k = k; o.classList.add('on'); o.onclick = k === 'end' ? null : closeOv; }
function closeOv() { const o = $('#ov'); o.classList.remove('on'); o.dataset.k = ''; }
window.closeOv = closeOv;
function endOv() {
  if ($('#ov').dataset.k === 'end') return; Snd.win(); confetti('🏆');
  const medal = ['🥇', '🥈', '🥉'], n = G.rank.length;
  openOv(`<div style="font-size:54px">🏆</div><h2 style="font-size:34px;margin:0">경매 끝! 최종 순위</h2>
    <div style="display:grid;gap:8px;margin:14px 0">${G.rank.map((r, k) => { const t = G.teams[r.i], td = TEAMS[t.id], s = r.s; return `<div class="srow enter" style="--c:${td.c};animation-delay:${(n - 1 - k) * .9}s;grid-template-columns:44px 44px 1fr auto;${k === 0 ? 'background:var(--gold)' : ''}"><span>${medal[k] || k + 1 + '등'}</span><span style="font-size:1.4em">${td.e}</span><span style="text-align:left">${td.n} 모둠<small>보석 ${s.gem} · 세트 ${s.set + s.rb} · 상자 ${s.bonus} · 왕관 ${s.crown} · 코인 ${s.coin}</small></span><span>⭐ ${s.total}</span></div>`; }).join('')}</div>
    <div class="row"><button class="go" onclick="again()">🔁 한 판 더 (같은 모둠)</button><button onclick="closeOv()">닫기</button></div>`, 'end');
  $('#ov .card').style.width = 'min(720px,100%)';
}
window.again = () => { closeOv(); G.phase = 'lobby'; G.teams = []; G.rank = null; G.msg = ''; G.step = ''; G.item = null; G.round = 0; H.pub(); };

/* ---------------- 시작 ---------------- */
(async () => {
  app.innerHTML = '<div class="home"><div class="card"><div class="waitbig">💎</div><h2>연결하는 중…</h2></div></div>';
  await Net.init();
  if (Net.mode === 'local') { try { me = sessionStorage.getItem('au:tab') || ('t' + Math.random().toString(36).slice(2, 10)); sessionStorage.setItem('au:tab', me); } catch { } }   // 연습 모드: 탭마다 다른 학생
  render();
  if (/^\d{4}$/.test(new URLSearchParams(location.search).get('c') || '')) window.enter();
})();
</script>
</body>
